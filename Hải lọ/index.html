<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lọ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Người dâm nhất phòng 6</h1>
    </header>

    <main class="gallery-container">
      <div class="photo-grid">
        <div class="photo-item">
          <img src="img/hải.jpg" alt="Hải Lọ" class="gallery-image" />
          <div class="overlay">
            <span>Hải lọ</span>
          </div>
        </div>

        <div class="photo-item">
          <img src="img/Hải ca giủ.jpg" alt="Hải" class="gallery-image" />
          <div class="overlay">
            <span>Chân Dung</span>
          </div>
        </div>

        <div class="photo-item">
          <img src="img/ca 2.jpg" alt="Hải" class="gallery-image" />
          <div class="overlay">
            <span>Hải</span>
          </div>
        </div>

        <div class="photo-item">
          <img src="img/Trí.jpg" alt="Trí lọ" class="gallery-image" />
          <div class="overlay">
            <span>Trí</span>
          </div>
        </div>

        <div class="photo-item">
          <img src="img/Trí 2.jpg" alt="Trí 2" class="gallery-image" />
          <div class="overlay">
            <span>Trí</span>
          </div>
        </div>

        <div class="photo-item">
          <img src="img/trí 3.jpg" alt="Trí " class="gallery-image" />
          <div class="overlay">
            <span>trí</span>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; Thkhangg là trùm phòng 6</p>
    </footer>

</html>
